
name: README to Single HTML

on:
  workflow_dispatch:
    inputs:
      readme_path:
        description: "Path to README.md"
        required: true
        default: "README.md"
        type: string

permissions:
  contents: write

concurrency:
  group: readme-to-html
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Markdown parser and HTML sanitizer
        run: npm install --no-save marked sanitize-html

      - name: Convert README to single HTML
        env:
          README_PATH: ${{ inputs.readme_path }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { marked } from 'marked';
          import sanitizeHtml from 'sanitize-html';

          const readme = path.resolve(process.env.README_PATH || 'README.md');

          if (!fs.existsSync(readme) || !fs.statSync(readme).isFile()) {
            throw new Error(`README not found: ${readme}`);
          }

          if (path.basename(readme).toLowerCase() !== 'readme.md') {
            throw new Error('Input must be named README.md');
          }

          const dir = path.dirname(readme);
          const output = path.join(dir, 'index.html');
          const markdown = fs.readFileSync(readme, 'utf8');

          marked.setOptions({
            gfm: true,
            breaks: false
          });

          const rendered = marked.parse(markdown);

          const content = sanitizeHtml(rendered, {
            allowedTags: [
              ...sanitizeHtml.defaults.allowedTags,
              'img', 'h1', 'h2', 'h3', 'h4',
              'h5', 'h6', 'input', 'del',
              'details', 'summary', 'kbd',
              's', 'sup', 'sub', 'figure',
              'figcaption'
            ],
            allowedAttributes: {
              a: ['href', 'name', 'target', 'rel'],
              img: ['src', 'alt', 'title', 'width', 'height'],
              input: ['type', 'checked', 'disabled'],
              code: ['class'],
              pre: ['class'],
              ol: ['start', 'reversed'],
              '*': ['id']
            },
            allowedSchemes: ['http', 'https', 'mailto'],
            allowProtocolRelative: false,
            transformTags: {
              a: sanitizeHtml.simpleTransform('a', {
                rel: 'noopener noreferrer'
              })
            }
          });

          const html = `<!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="color-scheme" content="light dark">
          <title>${path.basename(dir) === '.' ? 'README' : path.basename(dir)}</title>
          <style>
          * { box-sizing: border-box; }
          body {
            margin: 0;
            padding: 24px 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
              "Segoe UI", sans-serif;
            line-height: 1.8;
            overflow-wrap: anywhere;
          }
          .center-inner {
            width: 95%;
            max-width: 1000px;
            margin: 0 auto;
          }
          img {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            margin: 1.5rem auto;
            object-fit: contain;
          }
          pre {
            overflow-x: auto;
            padding: 1rem;
            border-radius: 8px;
            background: #8882;
          }
          code {
            overflow-wrap: anywhere;
          }
          table {
            display: block;
            max-width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
          }
          th, td {
            padding: 8px 12px;
            border: 1px solid #8886;
          }
          blockquote {
            margin-left: 0;
            padding-left: 1rem;
            border-left: 4px solid #8888;
          }
          a { overflow-wrap: anywhere; }
          hr { border: 0; border-top: 1px solid #8886; }
          </style>
          </head>
          <body>
          <main class="center-inner">
          ${content}
          </main>
          </body>
          </html>
          `;

          fs.writeFileSync(output, html, 'utf8');
          console.log(`Generated: ${output}`);
          NODE

      - name: Commit and push generated HTML
        env:
          README_PATH: ${{ inputs.readme_path }}
        run: |
          set -eu

          DIR="$(dirname "$README_PATH")"
          if [ "$DIR" = "." ]; then
            OUTPUT="index.html"
          else
            OUTPUT="$DIR/index.html"
          fi

          git add -- "$OUTPUT"

          if git diff --cached --quiet; then
            echo "No changes to index.html."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Build index.html from README"
          git push
